name: factory

x-domain: &domain ${BASE_DOMAIN:-localhost}

services:
  traefik:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=factory-apps
      - --entrypoints.web.address=:80
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [apps]
    restart: unless-stopped

  portal:
    build: { context: ., dockerfile: packages/portal/Dockerfile }
    labels:
      traefik.enable: "true"
      traefik.http.routers.portal.rule: Host(`${BASE_DOMAIN:-localhost}`)
      traefik.http.routers.portal.entrypoints: web
      traefik.http.services.portal.loadbalancer.server.port: "80"
    networks: [apps]
    restart: unless-stopped

  factory:
    build: { context: ., dockerfile: packages/factory/Dockerfile }
    environment:
      ACCEPTANCE_MODE: ${ACCEPTANCE_MODE:-advisory}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in .env}
      BASE_DOMAIN: *domain
      BENCHMARK_TOKEN: ${BENCHMARK_TOKEN:-}
      CHAT_MESSAGES_PER_IP_PER_DAY: ${CHAT_MESSAGES_PER_IP_PER_DAY:-100}
      CHAT_MODEL: ${CHAT_MODEL:-claude-opus-5-5}
      CUSTOMER_QUESTIONS: ${CUSTOMER_QUESTIONS:-on}
      CUSTOMER_TIMEOUT_MINUTES: ${CUSTOMER_TIMEOUT_MINUTES:-15}
      DAILY_SPEND_CAP_USD: ${DAILY_SPEND_CAP_USD:-100}
      DEPLOYER_URL: http://deployer:4100
      FACTORY_MODEL: ${FACTORY_MODEL:-}
      LIBRARIAN: ${LIBRARIAN:-on}
      LIBRARIAN_LESSONS: ${LIBRARIAN_LESSONS:-on}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-1}
      MAX_REVISIONS: ${MAX_REVISIONS:-5}
      REVISION_BUDGET_USD: ${REVISION_BUDGET_USD:-5}
      PRD_GATES: ${PRD_GATES:-advisory}
      PUBLIC_HTTP_PORT: ${HTTP_PORT:-80}
      RUN_BUDGET_USD: ${RUN_BUDGET_USD:-15}
      RUNS_PER_IP_PER_DAY: ${RUNS_PER_IP_PER_DAY:-3}
    volumes:
      - ./data:/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.factory.rule: Host(`${BASE_DOMAIN:-localhost}`) && PathPrefix(`/api`)
      traefik.http.routers.factory.entrypoints: web
      traefik.http.services.factory.loadbalancer.server.port: "4000"
    networks: [apps, internal]
    depends_on: [deployer]
    restart: unless-stopped

  deployer:
    build: { context: ., dockerfile: packages/deployer/Dockerfile }
    environment:
      APPS_NETWORK: factory-apps
      BASE_DOMAIN: *domain
      TOKEN_FILE: /data/deployer.token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
    # On the apps network only to health-check app containers; every call
    # needs the token from the data volume, which apps cannot read.
    networks: [apps, internal]
    restart: unless-stopped

networks:
  apps:
    name: factory-apps
  internal:
    internal: true
